[package]
name = "ternarywire-app"
description = "TernaryWire: a lightweight, native API client"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "ternarywire-app"
path = "src/main.rs"

[dependencies]
ternarywire-core = { workspace = true, features = ["keychain"] }
ternarywire-http.workspace = true
ternarywire-auth.workspace = true
ternarywire-script.workspace = true
ternarywire-convert.workspace = true
ternarywire-runner.workspace = true
ternarywire-mock.workspace = true
ternarywire-mqtt = { path = "../ternarywire-mqtt" }
ternarywire-grpc = { path = "../ternarywire-grpc" }
ternarywire-socketio = { path = "../ternarywire-socketio" }
ternarywire-mcp = { path = "../ternarywire-mcp" }
ternarywire-ai = { path = "../ternarywire-ai" }
ternarywire-secrets = { path = "../ternarywire-secrets" }
ternarywire-flows = { path = "../ternarywire-flows" }
ternarywire-proxy = { path = "../ternarywire-proxy" }
ternarywire-html = { path = "../ternarywire-html" }
eframe.workspace = true
egui.workspace = true
egui_extras.workspace = true
rfd.workspace = true
open.workspace = true
tokio.workspace = true
tokio-util.workspace = true
serde.workspace = true
serde_json.workspace = true
indexmap.workspace = true
parking_lot.workspace = true
chrono.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
base64.workspace = true
url.workspace = true
uuid.workspace = true
tempfile.workspace = true
serde_yaml_ng.workspace = true
sha2.workspace = true
reqwest.workspace = true
image ={ version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico"] }

[dev-dependencies]
# Draws the real app off screen for visual checks (automation.rs, ignored test).
egui_kittest = { version = "0.37", features = ["eframe", "wgpu"] }
# What eframe adds outside tests (its `system_fonts` feature).
egui_system_font_provider = "0.37"

[target.'cfg(target_os = "macos")'.dependencies]
muda.workspace = true
# Centers the traffic lights in the app's own 44 px title bar (macos_titlebar.rs).
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSWindow", "NSView", "NSButton", "NSControl", "NSResponder"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSGeometry"] }
raw-window-handle = "0.6"
arboard.workspace = true
winit.workspace = true

[features]
default = ["wgpu"]
# Rendering backend: wgpu (Metal/Vulkan/DX12) or OpenGL via glow.
wgpu = ["eframe/wgpu"]
glow = ["eframe/glow"]
